theme = "onedark"

[editor]
true-color = true
auto-pairs=false
end-of-line-diagnostics = "hint"
bufferline = "multiple"

[editor.cursor-shape]
insert="bar"
normal="block"
select="underline"

[editor.file-picker]
# hidden=false

[editor.inline-diagnostics]
cursor-line="warning"

[keys.normal]
C-q=":bc"
